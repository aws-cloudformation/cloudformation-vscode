name: Pull Request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [ main ]

permissions:
  contents: read

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  pr-build-test-nodejs:
    needs: [ get-configs ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ needs.get-configs.outputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.get-configs.outputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Code Quality
        run: npm run lint && npm run check:duplicates

      - name: Test
        run: npm run test
