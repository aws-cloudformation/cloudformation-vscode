name: Pull Request

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  pr-build-test-nodejs:
    needs: [ get-configs ]
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
      code-quality: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ needs.get-configs.outputs.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.get-configs.outputs.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Code Quality
        run: npm run lint && npm run check:duplicates

      - name: Test
        run: npm run test

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
