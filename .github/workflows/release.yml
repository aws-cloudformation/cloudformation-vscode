name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to release (v1.0.0-beta, v1.0.0)"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (v1.0.0-beta, v1.0.0)"
        required: true
        type: string

jobs:
  get-configs:
    uses: ./.github/workflows/configs.yml

  version-and-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.validate-tag.outputs.tag }}
      is-prerelease: ${{ steps.validate-tag.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      
      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Validate tag matches version
        id: validate-tag
        run: |
          VERSION=${{ steps.get-version.outputs.version }}
          TAG=${{ inputs.tag }}
          
          if [[ "$TAG" == "v$VERSION" ]]; then
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^v$VERSION-[a-zA-Z0-9]+$ ]]; then
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "Error: Tag ($TAG) must be v$VERSION or v$VERSION-<suffix>"
            exit 1
          fi

  build-and-test:
    needs: [get-configs, version-and-tag]
    uses: ./.github/workflows/build-and-test.yml
    with:
      ref: ${{ needs.version-and-tag.outputs.tag }}

  release:
    needs: [get-configs, version-and-tag, build-and-test]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-and-tag.outputs.tag }}

      - name: Setup Node.js ${{ needs.get-configs.outputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.get-configs.outputs.node-version }}
          cache: 'npm'
          architecture: ${{ needs.get-configs.outputs.arch }}

      - name: Install Dependencies
        run: npm ci

      - name: Bundle
        shell: bash
        run: |
          if [[ "${{ needs.version-and-tag.outputs.is-prerelease }}" == "true" ]]; then
            npm run bundle:beta
          else
            npm run bundle:prod
          fi

      - name: Set release asset name
        id: set-asset-name
        shell: bash
        run: |
          APP_NAME=${{ needs.get-configs.outputs.app-name }}
          VERSION=${{ needs.version-and-tag.outputs.version }}
          TAG_SUFFIX=""
          if [[ "${{ needs.version-and-tag.outputs.is-prerelease }}" == "true" ]]; then
            TAG_SUFFIX="-beta"
          fi

          ASSET_NAME="${APP_NAME}-${VERSION}${TAG_SUFFIX}.vsix"
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "ASSET_PATH=./${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-and-tag.outputs.tag }}
          prerelease: ${{ needs.version-and-tag.outputs.is-prerelease }}
          files: ${{ steps.set-asset-name.outputs.ASSET_PATH }}
          generate_release_notes: true
          fail_on_unmatched_files: true
